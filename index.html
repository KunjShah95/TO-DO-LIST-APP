<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Todo List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="todo-container">
        <header class="app-header">
            <h1>Todo Master</h1>
            <p class="character-count">Character Limit: <span id="charCount">0/100</span></p>
        </header>

        <main>
            <div class="input-section">
                <input type="text" class="todo-input" placeholder="Add a new task..." maxlength="100">
                <button class="add-btn">Add Task</button>
            </div>

            <ul class="todo-list">
                <!-- Todo items will be added here dynamically -->
            </ul>

            <div class="stats">
                <span>Total tasks: <span id="totalTasks">0</span></span>
                <span>Completed: <span id="completedTasks">0</span></span>
            </div>
        </main>
    </section>
    <script src="script.js"></script>
</body>
</html>
